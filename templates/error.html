<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error - ASCII Art Web</title>

    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Outfit:wght@100..900&family=Sofia+Sans+Extra+Condensed:ital,wght@0,1..1000;1,1..1000&family=Syne+Mono&family=Tourney:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- ── main ────────────────────────────────────────────────────────────────────⊃ -->
    <script>
        // CRITICAL FIX: Match attribute-based dark mode selection instead of classList to sync with darkmode.js
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark'); // Or document.body once DOM binds, html level works early
        } else if (savedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
    </script>

    <style>
        /* Center layout targeting cyberpunk aesthetic */
        .errorContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            /* Keep content above canvas layers safely */
        }

        .errorCode {
            font-family: 'Tourney', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
        }

        .errorStatus {
            font-family: 'Sofia Sans Extra Condensed', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 5px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .errorMessage {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.1rem;
            max-width: 600px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .backButtonContainer {
            margin-top: 10px;
        }

        /* Standard utility inline adjustments mapping safely across core theme colors */
        .errorContainer .ascButton {
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>

<body>
    <!-- ── main ────────────────────────────────────────────────────────────────────⊃ -->
    <script>
        // Re-inject attribute straight to body early inside body context to fulfill style.css targets
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>

    <div class="topScrollWrapper">
        <div class="topScrollFakeContent"></div>
    </div>

    <div class="errorContainer">
        <h1 class="errorCode">{{ .StatusCode }}</h1>
        <div class="errorStatus">{{ .StatusText }}</div>
        <p class="errorMessage">{{ .Message }}</p>

        <div class="backButtonContainer">
            <a href="/" class="ascButton">Return To Term</a>
        </div>
    </div>


    <script src="/static/darkmode.js"></script>
    <script src="/static/bg.js"></script>
</body>

</html>
